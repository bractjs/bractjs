name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A framework pinned to one Bun version drifts silently on a quiet week. The
  # scheduled run exercises the `latest` matrix leg so upstream breakage shows up
  # as a failed cron rather than as a surprise in someone's PR.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# CI only reads the repo; never hand PR code a write-capable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The pinned leg is the contract (it matches packages/core's engines and
        # the lockfile); the `latest` leg is an early-warning signal and is
        # allowed to fail without blocking a merge.
        bun: ["1.4.2", "latest"]
    continue-on-error: ${{ matrix.bun == 'latest' }}
    name: check (bun ${{ matrix.bun }})
    steps:
      - uses: actions/checkout@v7

      # pnpm manages dependencies (version pinned via package.json#packageManager);
      # Bun is the runtime, test runner, and bundler.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint and format are toolchain checks, not runtime ones — running them on
      # every matrix leg would just report the same result twice.
      - name: Lint (ESLint)
        if: matrix.bun == '1.4.2'
        run: pnpm exec eslint .

      - name: Format check (Prettier)
        if: matrix.bun == '1.4.2'
        run: pnpm exec prettier --check .

      - name: Typecheck (framework + types + examples)
        run: pnpm -r typecheck

      - name: Generated types fresh (typegen produces no diff)
        run: |
          pnpm --filter @bractjs/bractjs typegen
          git diff --exit-code -- packages/core/types

      - name: Lockfile unchanged
        # bunx tsc used to re-resolve TypeScript and rewrite pnpm-lock.yaml as a
        # side effect; typescript is a devDependency now, so any diff here is a
        # real drift and should fail.
        run: git diff --exit-code pnpm-lock.yaml

      - name: Test (bun test, compile-smoke required)
        env:
          CI_REQUIRE_COMPILE: "1"
        run: pnpm test

      - name: Test (examples/cms)
        working-directory: examples/cms
        run: bun test

      - name: Publish dry-run (tarball contents)
        working-directory: packages/core
        run: bun run scripts/verify-pack.ts

  e2e:
    # Browser end-to-end tests against a production build of examples/todo.
    # Pinned Bun only: this checks the framework's browser behavior, not Bun drift.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: e2e (chrome)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      # ubuntu-latest ships Google Chrome; the suite drives it via channel: "chrome".
      - name: Browser tests
        env:
          CI: "1"
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
