name: Release

# Runs when a release tag is pushed:
#   verify  — tag, package.json and CHANGELOG agree; typecheck, tests, tarball gate.
#   publish — `npm publish --provenance` through npm trusted publishing (OIDC):
#             no token or OTP is stored anywhere; npm trusts this workflow file
#             in this repo. Skipped when the version is already on the registry,
#             so a tag pushed after a manual publish still goes through.
#   draft   — drafts the GitHub Release from the CHANGELOG section.
#
# One-time setup on npmjs.com (package settings → Trusted publishing): add a
# GitHub Actions publisher for repository bractjs/bractjs, workflow release.yml,
# environment "npm".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to draft a release for (e.g. v0.3.3)"
        required: true

# Least privilege: the job that installs dependencies and runs the test suite
# (third-party code) gets a read-only token; only the tiny `draft` job, which
# runs nothing but `gh`, can write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The dispatch input is untrusted text: never splice ${{ … }} into `run:`
    # scripts (shell injection) — pass it through the environment instead.
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version agreement (tag == package.json == newest CHANGELOG heading)
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/core/package.json').version")"
          LOG_VERSION="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"

          echo "tag=$TAG_VERSION  package.json=$PKG_VERSION  changelog=$LOG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$LOG_VERSION" ]; then
            echo "::error::Release inputs disagree — the tag, packages/core/package.json, and the newest CHANGELOG heading must all be $TAG_VERSION."
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Generated types fresh
        run: |
          pnpm --filter @bractjs/bractjs typegen
          git diff --exit-code -- packages/core/types

      - name: Test
        env:
          CI_REQUIRE_COMPILE: "1"
        run: pnpm test

      - name: Tarball gate
        working-directory: packages/core
        run: bun run scripts/verify-pack.ts

      - name: Extract changelog section
        id: notes
        run: |
          set -euo pipefail
          # Everything between this version's heading and the next `## [` heading.
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/       { exit }
            inside                   { print }
          ' CHANGELOG.md | sed '/^---$/d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG section found for ${TAG#v}."
            exit 1
          fi
          wc -l notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A protected environment: add required reviewers in the repo settings to
    # make every publish wait for a human approval.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Skip if this version is already published
        id: published
        working-directory: packages/core
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@bractjs/bractjs@$VERSION" version >/dev/null 2>&1; then
            echo "@bractjs/bractjs@$VERSION is already on npm — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts: prepublishOnly (typegen + tarball gate) needs the dev
      # toolchain and already ran in `verify` against this exact commit; the
      # generated types are committed, so the tarball is the same.
      - name: Publish with provenance
        if: steps.published.outputs.skip != 'true'
        working-directory: packages/core
        run: npm publish --provenance --access public --ignore-scripts

  draft:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Draft the GitHub Release
        run: |
          set -euo pipefail
          # Drafted, not published: a human skims the notes and hits publish.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --draft
          fi
